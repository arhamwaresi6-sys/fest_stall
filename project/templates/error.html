<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ code }} · Stall Desk</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body><main class="auth-page"><section class="panel error-card"><span class="error-code">{{ code }}</span><span class="food-icon food-large">🍟</span><h1>{{ title }}</h1><p class="muted">{{ message }}</p><a class="btn btn-primary" href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}">Back to {{ 'dashboard' if current_user.is_authenticated else 'sign in' }} →</a></section></main></body></html>
